<!DOCTYPE html>
<!-- frontend/backoffice/connexion.html — connexion du staff Juicy Solutions (backoffice interne) -->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Backoffice Agora — Connexion</title>
  <link rel="icon" href="/backoffice/logo.png?v=20260817-38" />
  <link rel="stylesheet" href="/backoffice/css/backoffice.css?v=20260817-38" />
</head>
<body>
  <div class="bo-login" x-data="connexionBackoffice()">
    <form class="bo-login__carte" @submit.prevent="connecter()">
      <div class="bo-login__titre">Agora <span style="color:var(--bo-accent)">·</span> Backoffice</div>
      <div class="bo-login__sous">Espace interne Juicy Solutions</div>

      <label for="email">Email</label>
      <input id="email" type="email" x-model="email" autocomplete="username" required />

      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" x-model="password" autocomplete="current-password" required />

      <button class="bo-btn" type="submit" :disabled="chargement" x-text="chargement ? 'Connexion…' : 'Se connecter'"></button>
      <div class="bo-erreur" x-text="erreur"></div>
    </form>
  </div>

  <script src="/backoffice/js/api.js?v=20260817-38"></script>
  <script src="/backoffice/vendor/alpine.min.js?v=20260817-38" defer></script>
  <script src="/backoffice/js/connexion.js?v=20260817-38"></script>
</body>
</html>
