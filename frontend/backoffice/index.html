<!DOCTYPE html>
<!-- frontend/backoffice/index.html — tableau de bord du backoffice interne Juicy Solutions -->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Backoffice Agora</title>
  <link rel="icon" href="/backoffice/logo.png?v=20260818-1" />
  <link rel="stylesheet" href="/backoffice/vendor/leaflet.css?v=20260818-1" />
  <link rel="stylesheet" href="/backoffice/css/backoffice.css?v=20260819-2" />
</head>
<body>
  <div class="bo-app" x-data="backoffice()" x-init="init()"
       @keydown.window.ctrl.k.prevent="ouvrirPalette()" @keydown.window.meta.k.prevent="ouvrirPalette()">
    <!-- Navigation -->
    <nav class="bo-nav">
      <div class="bo-nav__marque"><img src="/backoffice/logo.png?v=20260818-1" class="bo-nav__logo" alt="" onerror="this.remove()" />Agora <span>Backoffice</span></div>
      <div class="bo-nav__lien" :class="{ actif: vue === 'communes' || vue === 'fiche' }" @click="allerCommunes()">Communes clientes</div>
      <div class="bo-nav__lien" :class="{ actif: vue === 'prospection' || vue === 'prospect' }" @click="allerProspection()">Prospection</div>
      <div class="bo-nav__lien" :class="{ actif: vue === 'activite' }" @click="allerActivite()">Activité</div>
      <div class="bo-nav__lien" :class="{ actif: vue === 'reglages' }" @click="allerReglages()">Réglages</div>
      <div class="bo-nav__lien" @click="ouvrirPalette()" title="Ctrl/Cmd+K">🔍 Rechercher <span style="margin-left:auto; opacity:.5; font-size:11px">⌘K</span></div>
      <div class="bo-nav__pied">
        <div x-text="staff.nom"></div>
        <div style="margin-top:8px"><a @click.prevent="deconnexion()" href="#">Se déconnecter</a></div>
      </div>
    </nav>

    <!-- Palette de recherche globale (Ctrl/Cmd+K) -->
    <div class="bo-palette" x-show="paletteOuverte" x-cloak @keydown.escape.window="fermerPalette()">
      <div class="bo-palette__fond" @click="fermerPalette()"></div>
      <div class="bo-palette__boite">
        <input type="text" x-model="paletteRecherche" @input.debounce.250ms="rechercherPalette()"
               placeholder="Rechercher une commune ou un prospect…" x-ref="paletteInput" />
        <div class="bo-palette__resultats">
          <template x-if="paletteRecherche.trim() && paletteResultats.length === 0">
            <div class="bo-palette__vide">Aucun résultat.</div>
          </template>
          <template x-for="r in paletteResultats" :key="r.type + r.id">
            <div class="bo-palette__item" @click="allerVersResultatPalette(r)">
              <span class="bo-palette__type" x-text="r.type === 'commune' ? 'Commune' : 'Prospect'"></span>
              <span x-text="r.nom"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Contenu -->
    <main class="bo-main">
      <template x-if="chargement">
        <div class="bo-chargement">Chargement…</div>
      </template>

      <!-- Vue : liste des communes -->
      <template x-if="!chargement && vue === 'communes'">
        <div>
          <div class="bo-entete">
            <div>
              <div class="bo-titre">Communes clientes</div>
              <div class="bo-sous">Suivi des communes actives sur la plateforme.</div>
            </div>
            <a class="bo-btn bo-btn--sec bo-btn--compact" href="/api/backoffice/administration/communes-export.csv" download>⬇ Exporter en CSV</a>
          </div>
          <div class="bo-erreur" x-show="erreurChargement" x-text="erreurChargement" style="margin-bottom:16px"></div>

          <div class="bo-grille-stats">
            <div class="bo-stat"><div class="bo-stat__val" x-text="apercu.nb_communes ?? '—'"></div><div class="bo-stat__lib">Communes</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apercu.nb_citoyens ?? '—'"></div><div class="bo-stat__lib">Citoyens inscrits</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apercu.note_moyenne ?? '—'"></div><div class="bo-stat__lib">Note moyenne app</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apercu.nb_avis ?? '—'"></div><div class="bo-stat__lib">Avis déposés</div></div>
          </div>

          <div class="bo-carte">
            <table>
              <thead>
                <tr>
                  <th class="bo-th-tri" @click="trierPar('sante')" title="Statut, échéance et délivrabilité en un coup d'œil">Santé<span x-text="flecheTri('sante')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('nom')">Commune<span x-text="flecheTri('nom')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('statut_client')">Statut<span x-text="flecheTri('statut_client')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('population')">Population<span x-text="flecheTri('population')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('nb_citoyens')">Citoyens<span x-text="flecheTri('nb_citoyens')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('forfait')">Forfait<span x-text="flecheTri('forfait')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('note_moyenne')">Note app<span x-text="flecheTri('note_moyenne')"></span></th>
                  <th class="bo-th-tri" @click="trierPar('created_at')">Cliente depuis<span x-text="flecheTri('created_at')"></span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="c in communesPage()" :key="c.id">
                  <tr @click="ouvrirFiche(c.id)">
                    <td><span class="bo-sante" :title="santeCommune(c).titre" x-text="santeCommune(c).icone"></span></td>
                    <td class="bo-nom-commune" x-text="c.nom"></td>
                    <td><span class="bo-statut" :class="'bo-statut--' + (c.statut_client || 'active')" x-text="libelleStatutClient(c.statut_client)"></span></td>
                    <td x-text="c.population ? c.population.toLocaleString('fr-FR') : '—'"></td>
                    <td x-text="c.nb_citoyens"></td>
                    <td><span :class="{ 'bo-vide': !c.forfait }" x-text="c.forfait ? (c.forfait + (c.quota_go ? ' · ' + c.quota_go + ' Go' : '')) : '—'"></span></td>
                    <td>
                      <template x-if="c.note_moyenne !== null">
                        <span class="bo-note" :class="classeNote(c.note_moyenne)" x-text="'★ ' + c.note_moyenne + ' (' + c.nb_avis + ')'"></span>
                      </template>
                      <template x-if="c.note_moyenne === null"><span class="bo-vide">—</span></template>
                    </td>
                    <td x-text="formatDate(c.created_at)"></td>
                  </tr>
                </template>
                <template x-if="communes.length === 0">
                  <tr><td colspan="8" class="bo-vide" style="text-align:center">Aucune commune cliente pour l'instant.</td></tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="bo-outils" x-show="communes.length > 0" style="justify-content:space-between; margin-top:14px">
            <span class="bo-info" x-text="communesTriees().length.toLocaleString('fr-FR') + ' commune(s) · page ' + pageCommunes + ' sur ' + nbPagesCommunes()"></span>
            <div style="display:flex; gap:8px">
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="allerPageCommunes(-1)" :disabled="pageCommunes <= 1">← Précédent</button>
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="allerPageCommunes(1)" :disabled="pageCommunes >= nbPagesCommunes()">Suivant →</button>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('echeances')">
              <span>Facturation à traiter<span class="bo-tiroir__compte" x-show="echeances.length + facturesEnAttente.length" x-text="'— ' + (echeances.length + facturesEnAttente.length)"></span></span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.echeances}">▸</span>
            </button>
            <div class="bo-tiroir__corps bo-tiroir__corps--table" x-show="tiroirsOuverts.echeances">
              <div style="padding:14px 18px 4px" class="bo-info">Abonnements à renouveler (60 jours)</div>
              <template x-if="echeances.length === 0">
                <div style="padding:2px 18px 16px" class="bo-info">Aucune échéance dans les 60 prochains jours.</div>
              </template>
              <template x-if="echeances.length > 0">
                <table>
                  <thead><tr><th>Commune</th><th>Échéance</th><th>Jours restants</th><th>Prix TTC</th><th>Engagement</th></tr></thead>
                  <tbody>
                    <template x-for="e in echeances" :key="e.id">
                      <tr @click="ouvrirFiche(e.id)">
                        <td class="bo-nom-commune" x-text="e.nom"></td>
                        <td x-text="formatDate(e.prochaine_echeance)"></td>
                        <td><span :class="classeEcheance(e.prochaine_echeance)" x-text="joursAvantEcheance(e.prochaine_echeance) + ' j'"></span></td>
                        <td x-text="e.prix_annuel_ttc != null ? e.prix_annuel_ttc.toLocaleString('fr-FR') + ' €' : '—'"></td>
                        <td x-text="(e.duree_engagement_mois || 12) + ' mois'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>

              <div style="padding:14px 18px 4px; border-top:1px solid var(--bo-border); margin-top:6px" class="bo-info">Factures en attente de paiement</div>
              <template x-if="facturesEnAttente.length === 0">
                <div style="padding:2px 18px 16px" class="bo-info">Aucune facture en attente.</div>
              </template>
              <template x-if="facturesEnAttente.length > 0">
                <table>
                  <thead><tr><th>N°</th><th>Destinataire</th><th>Montant TTC</th><th>Échéance</th><th>Statut</th></tr></thead>
                  <tbody>
                    <template x-for="f in facturesEnAttente" :key="f.id">
                      <tr @click="f.commune_id ? ouvrirFiche(f.commune_id) : null">
                        <td x-text="f.numero"></td>
                        <td x-text="f.nom_destinataire"></td>
                        <td x-text="f.montant_ttc.toLocaleString('fr-FR') + ' €'"></td>
                        <td><span :class="classeEcheance(f.date_echeance)" x-text="formatDate(f.date_echeance)"></span></td>
                        <td x-text="f.statut"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('emails_rejetes')">
              <span>Emails rejetés (bounces)<span class="bo-tiroir__compte" x-show="emailsRejetes.length" x-text="'— ' + emailsRejetes.length"></span></span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.emails_rejetes}">▸</span>
            </button>
            <div class="bo-tiroir__corps bo-tiroir__corps--table" x-show="tiroirsOuverts.emails_rejetes">
              <div style="padding:16px 18px 0" class="bo-info">
                Un email rejeté marque le contact concerné « email invalide » et bloque tout renvoi automatique
                vers cette adresse (protection de la réputation d'expéditeur). Un rattrapage automatique via
                l'annuaire officiel (service-public.fr) tourne chaque nuit ; tu peux aussi le déclencher ici.
              </div>
              <div style="display:flex; align-items:center; gap:12px; padding:12px 18px 16px">
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="corrigerEmailsInvalides()" :disabled="correctionEnCours">
                  <span x-text="correctionEnCours ? 'Recherche…' : 'Corriger via l\'annuaire'"></span>
                </button>
                <span class="bo-info" x-text="correctionMsg"></span>
              </div>
              <template x-if="emailsRejetes.length === 0">
                <div style="padding:16px 18px" class="bo-info">Aucun email rejeté capté. (Capture automatique via le webhook Resend.)</div>
              </template>
              <template x-if="emailsRejetes.length > 0">
                <table>
                  <thead><tr><th>Adresse</th><th>Commune</th><th>Type</th><th>Raison</th><th>Date</th></tr></thead>
                  <tbody>
                    <template x-for="(e, i) in emailsRejetes" :key="i">
                      <tr style="cursor:default">
                        <td x-text="e.email"></td>
                        <td><span :class="{ 'bo-vide': !e.commune_nom }" x-text="e.commune_nom || '—'"></span></td>
                        <td><span class="bo-statut bo-statut--perdu" x-text="e.type === 'email.complained' ? 'Plainte' : 'Bounce'"></span></td>
                        <td><span :class="{ 'bo-vide': !e.raison }" x-text="e.raison || '—'"></span></td>
                        <td x-text="formatDate(e.created_at)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Vue : Réglages (configuration globale, rarement modifiée) -->
      <template x-if="!chargement && vue === 'reglages'">
        <div>
          <div class="bo-entete">
            <div>
              <div class="bo-titre">Réglages</div>
              <div class="bo-sous">Configuration globale de la plateforme — s'applique à toutes les communes.</div>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('diagnostic_email')">
              <span>Diagnostic email</span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.diagnostic_email}">▸</span>
            </button>
            <div class="bo-tiroir__corps" x-show="tiroirsOuverts.diagnostic_email">
              <div class="bo-info" style="margin-bottom:12px">Vérifie que l'envoi via Resend fonctionne (clé + domaine). Aucun prospect n'est affecté.</div>
              <div class="bo-outils" style="margin-bottom:10px">
                <input type="email" x-model="testEmailDest" placeholder="destinataire" style="min-width:240px" />
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="envoyerEmailTest()" :disabled="testEmailEnCours"
                        x-text="testEmailEnCours ? 'Envoi…' : 'Envoyer un email de test'"></button>
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="envoyerTestPresentation()" :disabled="testPresentationEnCours"
                        x-text="testPresentationEnCours ? 'Envoi…' : 'Tester la présentation (variante active)'"></button>
              </div>
              <div class="bo-info" style="margin-bottom:10px">
                Le test de présentation envoie le vrai modèle (variante active, avec un encart identifiants factice) à
                l'adresse ci-dessus, et crée une ligne de suivi — utile pour vérifier que le tracking Resend
                (ouverture/clic) remonte bien jusqu'au backoffice, sans créer de commune ni toucher un prospect réel.
                Non compté dans l'entonnoir de la page Prospection.
              </div>
              <div x-show="testEmailMsg" :class="testEmailOk ? '' : 'bo-erreur'" style="margin:0" x-text="testEmailMsg"></div>
              <div x-show="testPresentationMsg" style="margin:4px 0 0" x-text="testPresentationMsg"></div>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('palier_gratuit')">
              <span>Palier gratuit (modules inclus)</span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.palier_gratuit}">▸</span>
            </button>
            <div class="bo-tiroir__corps" x-show="tiroirsOuverts.palier_gratuit">
              <div class="bo-info" style="margin-bottom:12px">
                Modules offerts dans la version gratuite. <strong>Changement global et rétroactif</strong> :
                enregistrer applique immédiatement ce périmètre à toutes les communes actuellement sur le
                palier Gratuit (pas seulement aux futures).
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:14px">
                <template x-for="cle in ongletsDisponibles" :key="cle">
                  <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0; min-width:160px">
                    <input type="checkbox" :value="cle" x-model="ongletsGratuitsSelection" style="width:auto" />
                    <span x-text="libelleOnglet(cle)"></span>
                  </label>
                </template>
              </div>
              <div style="display:flex; align-items:center; gap:12px">
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="enregistrerOngletsGratuits()" :disabled="ongletsGratuitsEnCours">Enregistrer le palier gratuit</button>
                <span class="bo-info" x-text="ongletsGratuitsMsg"></span>
              </div>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('grille_tarifaire')">
              <span>Grille tarifaire (abonnement annuel TTC, par population)</span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.grille_tarifaire}">▸</span>
            </button>
            <div class="bo-tiroir__corps" x-show="tiroirsOuverts.grille_tarifaire">
              <div class="bo-info" style="margin-bottom:12px">
                Suivi des échéances uniquement — pas de paiement en ligne (règlement par mandat administratif).
                Ces tarifs servent de suggestion sur la fiche de chaque commune ; le montant final reste modifiable au cas par cas.
              </div>
              <table style="margin-bottom:14px">
                <thead><tr><th>Tranche de population</th><th>Prix annuel TTC</th></tr></thead>
                <tbody>
                  <template x-for="t in grilleTarifaire.tranches" :key="t.id">
                    <tr style="cursor:default">
                      <td x-text="libelleTranche(t)"></td>
                      <td><input type="number" min="0" step="10" x-model="t.prix_annuel_ttc" style="width:140px" /> €</td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <label style="margin-top:0">Mois offerts pour un engagement 3 ans</label>
              <input type="number" min="0" max="36" x-model="grilleTarifaire.mois_offerts_3ans" style="width:100px" />
              <div style="display:flex; align-items:center; gap:12px; margin-top:14px">
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="enregistrerGrille()" :disabled="grilleEnCours">Enregistrer la grille</button>
                <span class="bo-info" x-text="grilleMsg"></span>
              </div>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('entreprise')">
              <span>Informations légales de l'entreprise (devis &amp; factures)</span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.entreprise}">▸</span>
            </button>
            <div class="bo-tiroir__corps" x-show="tiroirsOuverts.entreprise">
              <div class="bo-info" style="margin-bottom:12px">
                Ces informations apparaissent sur chaque devis et facture générés. Une facture adressée à une
                commune (administration publique) doit ensuite être déposée sur <strong>Chorus Pro</strong>
                (obligatoire depuis 2020) — ce backoffice génère le PDF conforme, le dépôt reste manuel.
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px">
                <div>
                  <label style="margin-top:0">Raison sociale</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_raison_sociale" />
                </div>
                <div>
                  <label style="margin-top:0">Forme juridique</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_forme_juridique" placeholder="ex. Entreprise individuelle" />
                </div>
                <div>
                  <label>SIRET (14 chiffres)</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_siret" maxlength="14" />
                </div>
                <div>
                  <label>Email</label>
                  <input type="email" x-model="parametresEntreprise.entreprise_email" />
                </div>
                <div>
                  <label>Adresse</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_adresse" />
                </div>
                <div>
                  <label>Code postal &amp; ville</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_cp_ville" />
                </div>
                <div>
                  <label>Téléphone</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_telephone" />
                </div>
                <div>
                  <label>Mention TVA</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_mention_tva" />
                </div>
                <div>
                  <label>IBAN</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_iban" />
                </div>
                <div>
                  <label>BIC</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_bic" />
                </div>
                <div>
                  <label>Délai de paiement (jours)</label>
                  <input type="number" min="1" max="90" x-model="parametresEntreprise.entreprise_delai_paiement_jours" />
                </div>
                <div>
                  <label>Taux de pénalités de retard</label>
                  <input type="text" x-model="parametresEntreprise.entreprise_taux_penalites" placeholder="à confirmer avec ton comptable" />
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:12px; margin-top:14px">
                <button class="bo-btn bo-btn--sec bo-btn--compact" @click="enregistrerParametresEntreprise()" :disabled="parametresEntrepriseEnCours">Enregistrer</button>
                <span class="bo-info" x-text="parametresEntrepriseMsg"></span>
              </div>
            </div>
          </div>

          <div class="bo-tiroir">
            <button type="button" class="bo-tiroir__entete" @click="toggleTiroir('staff')">
              <span>Comptes staff</span>
              <span class="bo-tiroir__chevron" :class="{ouvert: tiroirsOuverts.staff}">▸</span>
            </button>
            <div class="bo-tiroir__corps bo-tiroir__corps--table" x-show="tiroirsOuverts.staff" x-init="chargerStaff()">
              <div style="padding:14px 18px 4px" class="bo-info">
                Aucune création de compte ici, volontairement : un compte staff ne se crée qu'en base directement
                (même principe que le rôle superadmin). Tu peux désactiver/réactiver un compte existant et
                réinitialiser son mot de passe.
              </div>
              <table>
                <thead><tr><th>Nom</th><th>Email</th><th>Statut</th><th>Dernière connexion</th><th></th></tr></thead>
                <tbody>
                  <template x-for="s in staffListe" :key="s.id">
                    <tr style="cursor:default">
                      <td x-text="s.nom"></td>
                      <td x-text="s.email"></td>
                      <td>
                        <button class="bo-btn bo-btn--sec bo-btn--compact" @click="toggleStaffActif(s)" x-text="s.actif ? 'Actif — désactiver' : 'Inactif — réactiver'"></button>
                      </td>

              <div class="bo-champ-inline">
                <label style="margin-top:0">TVA %</label>

                      <select x-model="d.statut" @change="changerStatutDevis(d)" style="width:auto">

                          <option :value="s" x-text="s"></option>
                        </template>
                      </select>
                    </td>
                    <td>
                      <span x-show="d.bon_commande_recu_le" class="bo-info" x-text="'Reçu · ' + formatDate(d.bon_commande_recu_le)"></span>
                      <button x-show="!d.bon_commande_recu_le" class="bo-btn bo-btn--sec bo-btn--compact" @click="enregistrerBonCommande(d)">Marquer reçu</button>
                    </td>
                    <td style="display:flex; gap:6px">
                      <a class="bo-btn bo-btn--sec bo-btn--compact" :href="'/backoffice/document?type=devis&id=' + d.id" target="_blank">Voir / PDF</a>

                    </td>
                  </tr>
                </template>
              </tbody>
            </table>

            <table style="margin-top:16px" x-show="facturesListe.length">
              <thead><tr><th>N°</th><th>Objet</th><th>Montant TTC</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
              <tbody>
                <template x-for="f in facturesListe" :key="f.id">
                  <tr style="cursor:default">
                    <td x-text="f.numero"></td>
                    <td x-text="f.objet"></td>
                    <td x-text="f.montant_ttc.toLocaleString('fr-FR') + ' €'"></td>
                    <td x-text="formatDate(f.date_echeance)"></td>
                    <td>
                      <select x-model="f.statut" @change="changerStatutFacture(f)" style="width:auto">
                        <template x-for="s in ['emise','deposee_chorus','payee']" :key="s">
                          <option :value="s" x-text="s"></option>
                        </template>
                      </select>
                    </td>
                    <td><a class="bo-btn bo-btn--sec bo-btn--compact" :href="'/backoffice/document?type=facture&id=' + f.id" target="_blank">Voir / PDF</a></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="bo-carte" style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px">

                      x-text="coordsEnCours ? 'Récupération…' : 'Récupérer les coordonnées'"></button>
            </div>
          </div>

          <div class="bo-carte" style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px">
            <div>
              <div style="font-weight:600">Accès du maire</div>
              <div class="bo-info">Régénère un mot de passe temporaire et renvoie l'email de bienvenue au maire.</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px">
              <span class="bo-info" x-text="accesMsg"></span>
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="renvoyerAcces()" :disabled="accesEnCours"
                      x-text="accesEnCours ? 'Envoi…' : 'Renvoyer les accès'"></button>

          </div>

          <div class="bo-section-titre">Répartition des rôles</div>

          </div>

                <div class="bo-avis-item__tete">
                  <span class="bo-note" :class="classeNote(a.note)" x-text="'★ ' + a.note + '/5'"></span>
                  <span class="bo-avis-item__date" x-text="formatDate(a.created_at)"></span>
                </div>
                <div x-text="a.commentaire || '(sans commentaire)'" :class="{ 'bo-vide': !a.commentaire }"></div>
              </div>
            </template>
            <template x-if="fiche.avis.nb === 0">
              <div class="bo-avis-item bo-vide">Aucun avis déposé.</div>
            </template>
          </div>
        </div>
      </template>

      <!-- Vue : prospection (import + liste) -->
      <template x-if="!chargement && vue === 'prospection'">
        <div>
          <div class="bo-entete">

              <div class="bo-titre">Prospection</div>
              <div class="bo-sous">Communes françaises à démarcher, importées depuis l'open data officiel.</div>
            </div>
            <a class="bo-btn bo-btn--sec bo-btn--compact" :href="urlExportProspects()" download>⬇ Exporter en CSV</a>
          </div>
          <div class="bo-erreur" x-show="erreurChargement" x-text="erreurChargement" style="margin-bottom:16px"></div>

          <div class="bo-grille-stats">
            <div class="bo-stat"><div class="bo-stat__val" x-text="apProsp.total ?? '—'"></div><div class="bo-stat__lib">Prospects</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apProsp.par_statut ? apProsp.par_statut.a_contacter : '—'"></div><div class="bo-stat__lib">À contacter</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apProsp.par_statut ? apProsp.par_statut.gagne : '—'"></div><div class="bo-stat__lib">Gagnés</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apProsp.a_relancer ?? '—'"></div><div class="bo-stat__lib">À relancer</div></div>
            <div class="bo-stat"><div class="bo-stat__val" x-text="apProsp.contactes_avec_commune ?? '—'"></div><div class="bo-stat__lib">Contactés, commune activée</div></div>
            <div class="bo-stat"><div class="bo-stat__val" :class="{ 'bo-note--basse': apProsp.contactes_sans_commune }" x-text="apProsp.contactes_sans_commune ?? '—'"></div><div class="bo-stat__lib">Contactés, à rattraper</div></div>
          </div>

          <div class="bo-tiroir">

            </button>

              <template x-if="statsVariantes.length === 0">
                <div style="padding:16px 18px" class="bo-info">Aucun envoi suivi pour l'instant.</div>
              </template>
              <template x-if="statsVariantes.length > 0">
                <table>
                  <thead><tr><th>Variante</th><th>Période d'envoi</th><th>Envoyés</th><th>Ouverts</th><th>Ouverture (≥7j)</th><th>Cliqués</th><th>Rejetés</th><th>Connectés</th></tr></thead>
                  <tbody>
                    <template x-for="v in statsVariantes" :key="v.nom">
                      <tr style="cursor:default">
                        <td x-text="v.nom"></td>
                        <td class="bo-info" x-text="periodeEnvoi(v)"></td>
                        <td x-text="v.envoyes"></td>
                        <td x-text="pct(v.ouverts, v.envoyes)"></td>
                        <td :title="'Sur les ' + v.envoyes_matures + ' envoi(s) vieux d\'au moins 7 jours'" x-text="v.taux_ouverture_mature === null ? '—' : v.taux_ouverture_mature + ' %'"></td>
                        <td x-text="pct(v.cliques, v.envoyes)"></td>
                        <td x-text="pct(v.rejetes, v.envoyes)"></td>
                        <td x-text="pct(v.connectes, v.envoyes)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
              <div style="padding:12px 18px" class="bo-info">
                « Connectés » = le maire s'est réellement connecté au moins une fois — signal plus fiable que l'ouverture
                (faussée par Apple Mail qui précharge le pixel de tracking chez une partie des destinataires).
                Ouvertures et clics nécessitent le tracking activé côté Resend (Domaines → Configuration).
                « Ouverture (≥7j) » ne compte que les envois vieux d'au moins 7 jours (une variante envoyée
                récemment n'a pas fini d'accumuler ses ouvertures) — plus fiable que le taux brut pour comparer
                deux variantes envoyées à des périodes différentes.
              </div>
            </div>
          </div>

          <div class="bo-outils" style="justify-content:space-between; margin-bottom:6px">

          </div>
          <div class="bo-outils" style="justify-content:flex-end; margin-bottom:16px">

          </div>

              <label>Population max (optionnel)</label>
              <input type="number" x-model="importPopMax" placeholder="toutes" min="1" />

            <span class="bo-info" x-text="importMsg"></span>
          </form>

          <div class="bo-outils">
            <select x-model="filtreStatut" @change="appliquerFiltres()">

            </select>
            <input type="text" x-model="filtreDep" @input.debounce.400ms="appliquerFiltres()" placeholder="Département" style="max-width:130px" />
            <input type="text" x-model="filtreRecherche" @input.debounce.400ms="appliquerFiltres()" placeholder="Rechercher une commune" />
            <select x-model="filtreTri" @change="appliquerFiltres()">
              <option value="nom">Tri : Nom (A→Z)</option>
              <option value="departement">Département</option>
              <option value="population_desc">Population (décroissant)</option>
              <option value="population_asc">Population (croissant)</option>
            </select>
            <label style="display:flex; align-items:center; gap:6px; white-space:nowrap; font-weight:600">
              <input type="checkbox" x-model="filtreInscrits" @change="appliquerFiltres()">
              🔥 S'est inscrit <span x-show="totalInscrits" x-text="'(' + totalInscrits + ')'"></span>
            </label>
          </div>

          <!-- Bascule Liste / Carte -->
          <div class="bo-outils" style="margin-bottom:14px">
            <button class="bo-btn bo-btn--compact" :class="{ 'bo-btn--sec': sousVueProspection !== 'liste' }" @click="sousVueProspection = 'liste'">Liste</button>
            <button class="bo-btn bo-btn--compact" :class="{ 'bo-btn--sec': sousVueProspection !== 'carte' }" @click="afficherCarte()">Carte</button>
            <span class="bo-info" x-show="sousVueProspection === 'carte'">Seules les communes déjà enrichies (avec coordonnées) apparaissent — la carte se remplit au fil de la prospection.</span>
          </div>

          <!-- Barre d'action groupée -->
          <div class="bo-outils" x-show="sousVueProspection === 'liste' && nbSelection() > 0" style="justify-content:space-between; flex-wrap:wrap; row-gap:10px">
            <span class="bo-info" x-text="nbSelection() + ' commune(s) sélectionnée(s)' + (nbSelection() > 40 ? ' — max 40 par envoi' : '')"></span>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">

                <option value="">Changer le statut…</option>
                <template x-for="s in statuts" :key="s"><option :value="s" x-text="libelleStatut(s)"></option></template>
              </select>
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="appliquerStatutLot()" :disabled="!statutLotChoisi || statutLotEnCours">Appliquer</button>
              <span class="bo-info" x-text="lotMsg"></span>
              <button class="bo-btn bo-btn--compact" @click="envoyerLot()" :disabled="lotEnCours || nbSelection() === 0 || envoiLigneId !== null || rattrapageEnCours"
                      x-text="lotEnCours ? (lotMsg || 'Envoi…') : ('✉ Envoyer la présentation aux ' + nbSelection() + ' sélectionnés')"></button>
            </div>
          </div>

          <div class="bo-carte" x-show="sousVueProspection === 'liste'">
            <table>
              <thead>
                <tr>
                  <th style="width:34px"><input type="checkbox" style="width:auto" :checked="toutSelectionne()" @change="basculerTout()" /></th>
                  <th>Commune</th><th>Dépt</th><th>Population</th><th>Statut</th><th>Contact</th><th>Relance</th><th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="p in prospects" :key="p.id">
                  <tr @click="ouvrirProspect(p.id)">
                    <td @click.stop><input type="checkbox" style="width:auto" :checked="estSelectionne(p.id)" @change="basculer(p.id)" /></td>
                    <td class="bo-nom-commune">
                      <span x-text="p.nom"></span>
                      <span x-show="p.inscrit" title="Un citoyen s'est inscrit lui-même — signal fort, priorité pour un vrai contact" style="margin-left:4px">🔥</span>
                    </td>
                    <td x-text="p.departement"></td>
                    <td x-text="p.population ? p.population.toLocaleString('fr-FR') : '—'"></td>
                    <td><span class="bo-statut" :class="'bo-statut--' + p.statut" x-text="libelleStatut(p.statut)"></span></td>
                    <td>
                      <template x-if="p.email_invalide"><span class="bo-note--basse" title="Adresse rejetée (bounce)" x-text="'⚠ ' + (p.contact_email || 'email invalide')"></span></template>
                      <template x-if="!p.email_invalide"><span :class="{ 'bo-vide': !p.contact_email }" x-text="p.contact_email || 'non enrichi'"></span></template>
                    </td>
                    <td><span :class="relanceEnRetard(p) ? 'bo-note--basse' : ''" x-text="p.prochaine_relance_le ? formatDate(p.prochaine_relance_le) : '—'"></span></td>

                      <button class="bo-btn bo-btn--sec bo-btn--compact" @click="envoyerPresentationLigne(p)" :disabled="envoiLigneId !== null || lotEnCours || rattrapageEnCours"

                    </td>

                </template>
              </tbody>
            </table>
          </div>

              <button class="bo-btn bo-btn--compact" @click="prospecter()" :disabled="prospEnCours"

          </div>

          <div class="bo-grille-2">
            <!-- Colonne gauche : contact + pilotage -->
            <div>
              <div class="bo-section-titre" style="margin-top:0">Contact mairie</div>
              <div class="bo-carte" style="padding:14px 18px">
                <template x-if="!prospect.enrichi_le">
                  <div class="bo-info" style="margin-bottom:10px">Contact non récupéré depuis l'annuaire.</div>
                </template>
                <div class="bo-contact-ligne"><span>Email</span><span x-text="prospect.contact_email || '—'"></span></div>
                <div class="bo-contact-ligne"><span>Téléphone</span><span x-text="prospect.contact_telephone || '—'"></span></div>
                <div class="bo-contact-ligne"><span>Site web</span><span x-text="prospect.site_web || '—'"></span></div>
                <div class="bo-contact-ligne"><span>Adresse</span><span x-text="prospect.adresse || '—'"></span></div>
                <button class="bo-btn bo-btn--sec bo-btn--compact" style="margin-top:12px" @click="enrichir()" :disabled="enrichEnCours"
                        x-text="enrichEnCours ? 'Récupération…' : (prospect.enrichi_le ? 'Réactualiser le contact' : 'Récupérer le contact')"></button>
              </div>

              <div class="bo-section-titre">Pilotage</div>
              <div class="bo-carte" style="padding:14px 18px">
                <label>Statut</label>
                <select x-model="prospect.statut" @change="majProspect({ statut: prospect.statut })">
                  <template x-for="s in statuts" :key="s"><option :value="s" x-text="libelleStatut(s)"></option></template>
                </select>
                <label>Prochaine relance</label>
                <input type="date" x-model="prospect.prochaine_relance_le" @change="majProspect({ prochaine_relance_le: prospect.prochaine_relance_le || null })" />
                <label>Notes</label>
                <textarea x-model="prospect.notes" @blur="majProspect({ notes: prospect.notes })"></textarea>
              </div>
            </div>

            <!-- Colonne droite : timeline -->
            <div>
              <div class="bo-section-titre" style="margin-top:0">Historique</div>
              <div class="bo-carte" style="padding:14px 18px">
                <form @submit.prevent="ajouterInteraction()" style="margin-bottom:8px">
                  <select x-model="nouvInteraction.type" style="margin-bottom:8px">
                    <template x-for="t in typesInteraction" :key="t"><option :value="t" x-text="libelleType(t)"></option></template>
                  </select>
                  <textarea x-model="nouvInteraction.contenu" placeholder="Compte-rendu de l'échange…"></textarea>
                  <button class="bo-btn bo-btn--compact" type="submit" :disabled="!nouvInteraction.contenu.trim()">Ajouter à l'historique</button>
                </form>

                <template x-for="(it, i) in interactions" :key="i">
                  <div class="bo-timeline-item">
                    <span class="bo-timeline__type"><span class="bo-badge" x-text="libelleType(it.type)"></span></span>
                    <div class="bo-timeline__corps">
                      <div x-text="it.contenu"></div>
                      <div class="bo-timeline__meta" x-text="formatDateHeure(it.created_at)"></div>
                    </div>
                  </div>
                </template>
                <template x-if="interactions.length === 0"><div class="bo-vide">Aucun échange enregistré.</div></template>
              </div>
            </div>
          </div>

          <!-- Onboarding : convertir le prospect en commune cliente -->
          <div class="bo-section-titre">Onboarding</div>
          <div class="bo-carte" style="padding:16px 18px">
            <!-- Déjà cliente -->
            <template x-if="prospect.commune_id">
              <div>
                <div class="bo-statut bo-statut--gagne" style="margin-bottom:12px">Commune cliente</div>
                <div class="bo-info" style="margin-bottom:12px">Cette commune est active sur la plateforme.</div>
                <a class="bo-btn bo-btn--sec bo-btn--compact" :href="'/' + conversion.slug + '/'" target="_blank" x-show="conversion.slug">Ouvrir l'app</a>
                <a class="bo-btn bo-btn--compact" :href="lienFiche(conversion.slug, prospect.nom)" target="_blank" x-show="conversion.slug" style="margin-left:8px">Fiche de présentation</a>
              </div>
            </template>

            <!-- Pas encore cliente -->
            <template x-if="!prospect.commune_id">
              <div>
                <template x-if="!conversion.ouvert && !conversion.succes">
                  <button class="bo-btn bo-btn--compact" @click="ouvrirConversion()">Convertir en commune cliente</button>
                </template>

                <!-- Formulaire de conversion -->
                <template x-if="conversion.ouvert && !conversion.succes">
                  <form @submit.prevent="convertir()">
                    <div class="bo-grille-2">
                      <div>
                        <label>Nom de la commune</label>
                        <input type="text" x-model="conversion.nom" required />
                        <label>Slug (adresse de l'app)</label>
                        <input type="text" x-model="conversion.slug" required />
                        <div class="bo-info" x-text="'plateforme-agora.fr/' + (conversion.slug || '…') + '/'"></div>
                      </div>
                      <div>
                        <label>Email du maire</label>
                        <input type="email" x-model="conversion.maireEmail" required />
                        <div class="bo-grille-2" style="gap:10px">
                          <div><label>Prénom</label><input type="text" x-model="conversion.mairePrenom" required /></div>
                          <div><label>Nom</label><input type="text" x-model="conversion.maireNom" required /></div>
                        </div>
                        <label>Mot de passe temporaire</label>
                        <input type="text" x-model="conversion.mairePassword" required minlength="6" />
                      </div>
                    </div>
                    <label style="display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer">
                      <input type="checkbox" x-model="conversion.envoyerEmail" style="width:auto" />
                      <span>Envoyer les accès (identifiants provisoires) au maire par email</span>
                    </label>
                    <div style="display:flex; gap:10px; align-items:center; margin-top:14px">
                      <button class="bo-btn bo-btn--compact" type="submit" :disabled="conversion.enCours" x-text="conversion.enCours ? 'Création…' : 'Créer la commune cliente'"></button>
                      <button class="bo-btn bo-btn--sec bo-btn--compact" type="button" @click="conversion.ouvert = false">Annuler</button>
                      <span class="bo-erreur" style="margin:0" x-text="conversion.erreur"></span>
                    </div>
                  </form>
                </template>

                <!-- Succès -->
                <template x-if="conversion.succes">
                  <div>
                    <div class="bo-statut bo-statut--gagne" style="margin-bottom:12px">Commune créée 🎉</div>
                    <div class="bo-info" style="margin-bottom:12px" x-text="'App accessible sur ' + conversion.url"></div>
                    <a class="bo-btn bo-btn--sec bo-btn--compact" :href="'/' + conversion.slug + '/'" target="_blank">Ouvrir l'app</a>
                    <a class="bo-btn bo-btn--compact" :href="lienFiche(conversion.slug, conversion.nom)" target="_blank" style="margin-left:8px">Fiche de présentation + QR</a>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Vue : liste des utilisateurs d'une commune -->
      <template x-if="!chargement && vue === 'utilisateurs'">
        <div>
          <div class="bo-retour" @click="vue = 'fiche'">← Retour à la commune</div>
          <div class="bo-entete">
            <div>
              <div class="bo-titre" x-text="'Utilisateurs · ' + communeActiveNom"></div>
              <div class="bo-sous" x-text="totalUtilisateurs.toLocaleString('fr-FR') + ' compte(s)'"></div>
            </div>
          </div>
          <div class="bo-erreur" x-show="erreurChargement" x-text="erreurChargement" style="margin-bottom:16px"></div>

          <div class="bo-outils">
            <select x-model="filtreUtilisateurRole" @change="appliquerFiltresUtilisateurs()">
              <option value="">Tous les rôles</option>
              <template x-for="r in rolesGerables" :key="r"><option :value="r" x-text="libelleRole(r)"></option></template>
            </select>
            <input type="text" x-model="filtreUtilisateurRecherche" @input.debounce.400ms="appliquerFiltresUtilisateurs()" placeholder="Rechercher (nom, email)" />
            <button class="bo-btn bo-btn--compact" @click="basculerFormUtilisateur()" x-text="formUtilisateurOuvert ? 'Annuler' : '+ Ajouter un utilisateur'"></button>
          </div>

          <!-- Formulaire de création -->
          <template x-if="formUtilisateurOuvert">
            <form class="bo-form-import" @submit.prevent="creerUtilisateur()">
              <div class="bo-champ"><label>Prénom</label><input type="text" x-model="nouvelUtilisateur.prenom" required /></div>
              <div class="bo-champ"><label>Nom</label><input type="text" x-model="nouvelUtilisateur.nom" required /></div>
              <div class="bo-champ"><label>Email</label><input type="email" x-model="nouvelUtilisateur.email" required style="width:220px" /></div>
              <div class="bo-champ">
                <label>Rôle</label>
                <select x-model="nouvelUtilisateur.role" style="width:auto">
                  <template x-for="r in rolesGerables" :key="r"><option :value="r" x-text="libelleRole(r)"></option></template>
                </select>
              </div>
              <div class="bo-champ"><label>Mot de passe temporaire</label><input type="text" x-model="nouvelUtilisateur.password" required minlength="6" /></div>
              <button class="bo-btn bo-btn--compact" type="submit" :disabled="utilisateurEnCours">Créer</button>
              <span class="bo-info" x-text="msgUtilisateurs"></span>
            </form>
          </template>

          <div class="bo-carte">
            <table>
              <thead>
                <tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Niveau</th><th>Inscrit le</th><th>Dernière connexion</th></tr>
              </thead>
              <tbody>
                <template x-for="u in utilisateurs" :key="u.id">
                  <tr @click="ouvrirUtilisateur(u)">
                    <td class="bo-nom-commune" x-text="u.prenom + ' ' + u.nom"></td>
                    <td x-text="u.email"></td>
                    <td><span class="bo-statut" :class="'bo-statut--' + u.role" x-text="libelleRole(u.role)"></span></td>
                    <td x-text="'Niv. ' + (u.niveau ?? 1)"></td>
                    <td x-text="formatDate(u.created_at)"></td>
                    <td><span :class="{ 'bo-vide': !u.derniere_connexion_streak }" x-text="u.derniere_connexion_streak ? formatDate(u.derniere_connexion_streak) : '—'"></span></td>
                  </tr>
                </template>
                <template x-if="utilisateurs.length === 0">
                  <tr><td colspan="6" class="bo-vide" style="text-align:center">Aucun utilisateur.</td></tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="bo-outils" x-show="totalUtilisateurs > 0" style="justify-content:space-between; margin-top:14px">
            <span class="bo-info" x-text="'page ' + pageUtilisateurs + ' sur ' + nbPagesUtilisateurs()"></span>
            <div style="display:flex; gap:8px">
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="allerPageUtilisateurs(-1)" :disabled="pageUtilisateurs <= 1">← Précédent</button>
              <button class="bo-btn bo-btn--sec bo-btn--compact" @click="allerPageUtilisateurs(1)" :disabled="pageUtilisateurs >= nbPagesUtilisateurs()">Suivant →</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Vue : fiche d'un utilisateur -->
      <template x-if="!chargement && vue === 'utilisateur' && utilisateurEdite">
        <div>
          <div class="bo-retour" @click="vue = 'utilisateurs'">← Retour aux utilisateurs</div>
          <div class="bo-titre" x-text="utilisateurEdite.prenom + ' ' + utilisateurEdite.nom"></div>
          <div class="bo-sous" style="margin-bottom:18px" x-text="'Inscrit le ' + formatDate(utilisateurEdite.created_at)"></div>

          <div class="bo-carte" style="padding:16px 18px; max-width:480px">
            <label style="margin-top:0">Prénom</label>
            <input type="text" x-model="utilisateurEdite.prenom" />
            <label>Nom</label>
            <input type="text" x-model="utilisateurEdite.nom" />
            <label>Email</label>
            <input type="email" x-model="utilisateurEdite.email" />
            <label>Rôle</label>
            <select x-model="utilisateurEdite.role">
              <template x-for="r in rolesGerables" :key="r"><option :value="r" x-text="libelleRole(r)"></option></template>
            </select>
            <div style="display:flex; align-items:center; gap:12px; margin-top:14px">
              <button class="bo-btn bo-btn--compact" @click="enregistrerUtilisateur()" :disabled="utilisateurEnCours">Enregistrer</button>
              <span class="bo-info" x-text="msgUtilisateurs"></span>
            </div>
          </div>

          <div class="bo-section-titre">Accès</div>
          <div class="bo-carte" style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
            <div class="bo-info">Régénère un mot de passe temporaire, affiché une fois pour que tu le communiques.</div>
            <button class="bo-btn bo-btn--sec bo-btn--compact" @click="reinitialiserMdpUtilisateur()" :disabled="utilisateurEnCours">Réinitialiser le mot de passe</button>
          </div>
          <div class="bo-carte" x-show="resetMdpResultat" style="padding:14px 18px; margin-top:10px">
            <div style="font-weight:600; margin-bottom:6px">Nouveau mot de passe (affiché une seule fois)</div>
            <div x-text="resetMdpResultat"></div>
          </div>

          <div class="bo-section-titre">Zone sensible</div>
          <div class="bo-carte" style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
            <div class="bo-info">Supprime le compte (anonymisation RGPD — le contenu déjà publié reste, sans identité).</div>
            <button class="bo-btn bo-btn--sec bo-btn--compact" style="border-color:#f87171; color:#f87171" @click="supprimerUtilisateur()" :disabled="utilisateurEnCours">🗑 Supprimer le compte</button>
          </div>
        </div>
      </template>
    </main>
  </div>

  <script src="/backoffice/vendor/leaflet.js?v=20260818-1"></script>
  <script src="/backoffice/vendor/qrcode.min.js?v=20260818-1"></script>
  <script src="/backoffice/js/api.js?v=20260818-5"></script>
  <script src="/backoffice/js/app.js?v=20260819-5"></script>
  <script src="/backoffice/vendor/alpine.min.js?v=20260818-1" defer></script>
</body>
</html>
