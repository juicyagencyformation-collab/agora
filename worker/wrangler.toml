name = "agora-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
# nodejs_compat : exigé par @cloudflare/puppeteer (journal papier, routes/journal.ts).
compatibility_flags = ["nodejs_compat"]

[vars]
R2_PUBLIC_BASE = "https://cdn.plateforme-agora.fr"
FRONTEND_URL = "https://plateforme-agora.fr"
EMAIL_FROM = "Agora <contact@plateforme-agora.fr>"
EMAIL_REPLY_TO_PROSPECTION = "prospection@replies.plateforme-agora.fr"
# Sites autorisés pour Turnstile (lib/anti-robots.ts) ; le secret TURNSTILE_SECRET se pose dans le tableau de bord Cloudflare.
TURNSTILE_HOSTNAMES = "plateforme-agora.fr,newappcitoyenne.pages.dev"

[[r2_buckets]]
binding = "BUCKET_R2"
bucket_name = "agora-uploads-eu"
jurisdiction = "eu"

# Documents signés des communes (backoffice/documents-commune.ts) : bucket PRIVÉ créé le
# 2026-11-04 — ne JAMAIS lui attacher de domaine public ni activer son adresse r2.dev.
[[r2_buckets]]
binding = "BUCKET_DOCUMENTS"
bucket_name = "agora-documents-eu"
jurisdiction = "eu"

[ai]
binding = "AI"

# Navigateur Chrome de Cloudflare (Browser Run) : fabrique le PDF du journal papier
# (routes/journal.ts). Absent de wrangler.test.toml, comme [ai].
[browser]
binding = "BROWSER"

# Limite de tentatives (connexion, formulaires) — voir src/lib/securite.ts. Inactive tant que le
# secret RELAIS_SECRET n'est pas configuré (Worker ET Pages). period : 10 ou 60 s uniquement.
[[ratelimits]]
name = "LIMITEUR_STRICT"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "LIMITEUR_LARGE"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 20
  period = 60

[triggers]
crons = ["0 3 1 * *", "0 4 * * *", "0 */6 * * *", "0 6 * * *", "0 * * * *"]
